apiVersion: 1

datasources:
  - name: Anomaly PostgreSQL
    type: postgres
    uid: postgres-anomalies
    access: proxy
    url: postgres:5432
    user: loganomaly
    secureJsonData:
      password: loganomaly
    jsonData:
      database: anomalies
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: true
    editable: false
